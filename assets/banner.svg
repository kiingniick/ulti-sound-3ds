<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Ulti-Sound - Nintendo 3DS Homebrew Media Player">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#180033"/>
      <stop offset="0.55" stop-color="#0a0120"/>
      <stop offset="1"   stop-color="#04010d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#00e5ff"/>
      <stop offset="0.5"  stop-color="#b06bff"/>
      <stop offset="1"    stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.5"  stop-color="#bfe6ff"/>
      <stop offset="0.5"  stop-color="#7f9cc0"/>
      <stop offset="1"    stop-color="#dff3ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ff59e6" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#7a2bff" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#7a2bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDev="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDev="14"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="420" fill="url(#sky)"/>
  <circle cx="640" cy="150" r="230" fill="url(#sun)"/>

  <!-- retro perspective grid -->
  <g stroke="#2de2ff" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="0"    y1="300" x2="1280" y2="300"/>
    <line x1="-40"  y1="330" x2="1320" y2="330"/>
    <line x1="-120" y1="368" x2="1400" y2="368"/>
    <line x1="-240" y1="420" x2="1520" y2="420"/>
  </g>
  <g stroke="#ff36c6" stroke-opacity="0.30" stroke-width="1.5">
    <line x1="640" y1="300" x2="640"  y2="420"/>
    <line x1="640" y1="300" x2="430"  y2="420"/>
    <line x1="640" y1="300" x2="150"  y2="420"/>
    <line x1="640" y1="300" x2="-220" y2="420"/>
    <line x1="640" y1="300" x2="850"  y2="420"/>
    <line x1="640" y1="300" x2="1130" y2="420"/>
    <line x1="640" y1="300" x2="1500" y2="420"/>
  </g>

  <!-- stars -->
  <g fill="#bfe9ff">
    <circle cx="120" cy="70"  r="2"/>
    <circle cx="1040" cy="60" r="2.4"/>
    <circle cx="1160" cy="120" r="1.8"/>
    <circle cx="230" cy="150" r="1.6"/>
    <circle cx="980" cy="180" r="1.6"/>
    <circle cx="60"  cy="210" r="1.8"/>
  </g>

  <!-- title -->
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="640" y="205" font-size="118" font-weight="900" letter-spacing="6"
          fill="url(#neon)" filter="url(#glow)">ULTI&#8226;SOUND</text>
    <text x="640" y="262" font-size="27" font-weight="700" letter-spacing="11"
          fill="url(#chrome)">NINTENDO 3DS HOMEBREW MEDIA PLAYER</text>
  </g>

  <!-- tagline chips -->
  <g font-family="Consolas, Menlo, monospace" text-anchor="middle" font-size="18" fill="#8be9ff" fill-opacity="0.85">
    <text x="640" y="352">[ AUDIO ]  [ MJPEG VIDEO ]  [ 5-BAND EQ ]  [ COVER FLOW ]  [ DARK MODE ]</text>
  </g>
</svg>
